; T-S17-06: pool de PHP-FPM de Banco de Talentos (reemplaza el www.conf de Debian).
[www]
user = www-data
group = www-data

; A3: Caddy pertenece al grupo www-data y usa este socket.
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 2 GB de RAM compartidos con ffmpeg: pocos procesos, reciclados con frecuencia.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Subidas de video de hasta 250 MB (max_input_time = 600).
request_terminate_timeout = 660

; Laravel escribe sus logs en stderr (LOG_CHANNEL=stderr): llegan a journald.
catch_workers_output = yes
decorate_workers_output = no
