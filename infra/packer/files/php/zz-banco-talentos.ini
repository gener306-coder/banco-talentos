; T-S17-06: mismos límites que docker/backend/php.ini (videos de hasta 250 MB, HU-S9-01).
upload_max_filesize = 250M
post_max_size = 260M
max_input_time = 600
max_execution_time = 120
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On

; El código es inmutable (una AMI por versión): opcache no revisa cambios en disco.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
