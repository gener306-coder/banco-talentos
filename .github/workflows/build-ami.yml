# T-S17-08: construye la AMI inmutable de una versión (docs/infra/pilot-aws-plan.md, §2 y §4).
# Requiere el CI en verde para el mismo commit, arma el artefacto (backend sin dependencias de desarrollo y frontend
# compilado) y ejecuta Packer con credenciales de corta duración por OIDC (sin llaves estáticas).
#
# Configuración del entorno «pilot» de GitHub (aprobación manual, solo la rama main y los tags v*):
#   vars.AWS_BUILD_AMI_ROLE_ARN    salida build_ami_role_arn de infra/terraform/bootstrap
#   vars.PACKER_SECURITY_GROUP_ID  salida packer_build_security_group_id
name: Build AMI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-ami
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PACKER_VERSION: 1.16.2

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  artifact:
    name: Artefacto de la versión
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend sin dependencias de desarrollo
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader --classmap-authoritative
      - name: Frontend compilado
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Armar release.tar.gz (sin .env, storage, cachés ni pruebas)
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          mkdir -p release/backend
          tar -C backend \
            --exclude='./tests' --exclude='./storage' --exclude='./.env' --exclude='./.env.*' \
            --exclude='./bootstrap/cache/*.php' --exclude='./phpunit.xml' --exclude='./node_modules' \
            -cf - . | tar -C release/backend -xf -
          cp -R frontend/dist release/frontend
          if find release -name '.env*' -print | grep -q .; then echo 'El artefacto contiene archivos .env' >&2; exit 1; fi
          tar -czf "release-$SHA.tar.gz" -C release .
          ls -lh "release-$SHA.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release-${{ steps.meta.outputs.sha }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  packer:
    name: Packer build
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: pilot
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.artifact.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: infra/packer
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_AMI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: build-ami-${{ github.run_id }}
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}
      # Packer se conecta por Session Manager: necesita el plugin en el runner.
      - name: Plugin de Session Manager
        run: |
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Packer init, validate y build
        working-directory: infra/packer
        env:
          PKR_VAR_release_sha: ${{ env.SHA }}
          PKR_VAR_artifact_path: release-${{ env.SHA }}.tar.gz
          PKR_VAR_build_security_group_id: ${{ vars.PACKER_SECURITY_GROUP_ID }}
          PKR_VAR_region: ${{ env.AWS_REGION }}
        run: |
          # La configuración viaja como un solo archivo: un directorio no sube por el túnel de Session Manager.
          tar -C files -czf bt-files.tar.gz .
          packer init .
          packer fmt -check .
          packer validate .
          packer build -color=false .
      - name: AMI construida
        id: ami
        working-directory: infra/packer
        run: |
          ami_id="$(jq -r '.builds[-1].artifact_id | split(":") | last' packer-manifest.json)"
          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"
          {
            echo "### AMI construida"
            echo "- Versión: \`$SHA\`"
            echo "- AMI: \`$ami_id\` (${AWS_REGION})"
            echo "- Siguiente paso: **Deploy pilot** con \`ami_id=$ami_id\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # Conserva las 3 AMI más recientes y la que usa alguna instancia; borra las demás con sus snapshots.
      - name: Limpieza de AMIs antiguas
        run: |
          in_use="$(aws ec2 describe-instances --filters Name=tag:App,Values=banco-talentos \
            Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].ImageId' --output text)"
          aws ec2 describe-images --owners self --filters Name=tag:App,Values=banco-talentos \
            --query 'sort_by(Images, &CreationDate)[].ImageId' --output text | tr '\t' '\n' | head -n -3 |
            while read -r image; do
              [ -n "$image" ] || continue
              if grep -qw "$image" <<<"$in_use"; then echo "En uso: $image"; continue; fi
              snapshots="$(aws ec2 describe-images --image-ids "$image" --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' --output text)"
              echo "Borrando $image ($snapshots)"
              aws ec2 deregister-image --image-id "$image"
              for snapshot in $snapshots; do aws ec2 delete-snapshot --snapshot-id "$snapshot"; done
            done
